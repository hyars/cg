<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Endless Racer</title>
  <style>
    :root {
      --bg: #07151f;
      --panel: rgba(5, 18, 26, 0.82);
      --line: rgba(255,255,255,0.08);
      --accent: #49f3b4;
      --warn: #ffdd57;
      --danger: #ff5e5b;
      --text: #edf6ff;
      --muted: #a1bac7;
      --road: #212a31;
      --lane: rgba(255,255,255,0.35);
      --grass: #0d3f2b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    body {
      position: relative;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#0d1a22, #07151f);
    }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      width: min(320px, calc(100vw - 32px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      backdrop-filter: blur(6px);
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      font-size: 14px;
      margin: 6px 0;
    }

    #leaderboard {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .leader-title {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .leader-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      padding: 6px 8px;
      margin: 5px 0;
      font-size: 13px;
    }

    .leader-item .name {
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .leader-item .score {
      color: var(--warn);
      font-weight: 700;
    }

    #message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(7, 21, 31, 0.82);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 20px;
      text-align: center;
      width: min(360px, calc(100vw - 30px));
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
      display: none;
    }

    #message.visible {
      display: block;
    }

    #message h2 {
      margin: 0 0 8px;
      font-size: clamp(24px, 6vw, 40px);
    }

    #message p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 16px;
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .action-btn, .touch-btn {
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.1s ease;
      touch-action: manipulation;
    }

    .action-btn {
      background: var(--accent);
      color: #08241d;
      padding: 10px 16px;
      min-width: 120px;
      font-size: 14px;
    }

    .touch-btn {
      background: rgba(255,255,255,0.10);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
      width: 72px;
      height: 60px;
      font-size: 26px;
    }

    .touch-btn:active, .action-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      pointer-events: none;
    }

    .control-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    @media (max-width: 640px) {
      #hud {
        top: 10px;
        left: 10px;
        width: min(260px, calc(100vw - 20px));
      }

      .hud-row {
        font-size: 12px;
      }

      #controls {
        bottom: 10px;
        padding: 0 10px;
      }

      .touch-btn {
        width: 60px;
        height: 54px;
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="hud-row"><span>Player</span><span id="playerName">User777</span></div>
    <div class="hud-row"><span>Speed</span><span id="speedValue">0</span></div>
    <div class="hud-row"><span>Score</span><span id="scoreValue">0</span></div>
    <div id="leaderboard"></div>
  </div>

  <div id="message">
    <h2>Race Over</h2>
    <p>Press R or tap restart to race again.</p>
    <div class="button-row">
      <button class="action-btn" id="restartBtn">Restart</button>
    </div>
  </div>

  <div id="controls">
    <div class="control-group">
      <button class="touch-btn" data-action="left">◀</button>
      <button class="touch-btn" data-action="right">▶</button>
    </div>
    <div class="control-group">
      <button class="touch-btn" data-action="boost">▲</button>
      <button class="touch-btn" data-action="brake">▼</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const speedValue = document.getElementById('speedValue');
    const scoreValue = document.getElementById('scoreValue');
    const leaderboardEl = document.getElementById('leaderboard');
    const messageEl = document.getElementById('message');
    const restartBtn = document.getElementById('restartBtn');

    const PLAYER_NAME = 'User777';
    const BOT_NAMES = ['User 1', 'User 2', 'User 3', 'Bot Nova', 'Bot Drift', 'Bot Viper', 'Bot Flash', 'Bot Racer'];

    const state = {
      gameOver: false,
      roadScroll: 0,
      player: null,
      racers: [],
      keys: {},
      controls: { left: false, right: false, boost: false, brake: false }
    };

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function shuffleList(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function laneX(lane) {
      const roadLeft = canvas.width * 0.26;
      const roadRight = canvas.width * 0.74;
      const laneWidth = (roadRight - roadLeft) / 3;
      return roadLeft + laneWidth * (lane + 0.5);
    }

    function makePlayer() {
      return {
        name: PLAYER_NAME,
        lane: 1,
        x: laneX(1),
        y: canvas.height - 120,
        width: 46,
        height: 84,
        speed: 0,
        maxSpeed: 250 / 18,
        score: 0
      };
    }

    function makeRacer(name, lane, y, speed, color) {
      return {
        name,
        lane,
        x: laneX(lane),
        y,
        width: 42,
        height: 78,
        speed,
        color,
        score: 0
      };
    }

    function resetGame() {
      state.player = makePlayer();
      state.roadScroll = 0;
      state.gameOver = false;
      messageEl.classList.remove('visible');

      const colors = ['#ff5e5b', '#ffb703', '#8ecae6', '#9bff8a', '#d9a7ff', '#ffd166', '#93c5fd', '#f7a1c4'];
      const names = shuffleList(BOT_NAMES);
      state.racers = [];

      for (let i = 0; i < 8; i++) {
        const lane = i % 3;
        const y = -120 - i * 110;
        const botSpeed = 200 / 18;
        state.racers.push(makeRacer(names[i % names.length], lane, y, botSpeed, colors[i % colors.length]));
      }

      updateHUD();
    }

    function movePlayer(direction) {
      if (state.gameOver) return;

      const currentLane = state.player.lane;

      if (direction === 1 && currentLane === 0) {
        state.player.lane = 1;
        return;
      }

      if (direction === -1 && currentLane === 2) {
        state.player.lane = 1;
        return;
      }

      state.player.lane = clamp(currentLane + direction, 0, 2);
    }

    function updatePlayer() {
      if (state.gameOver) {
        return;
      }

      if (state.keys.ArrowLeft || state.controls.left) {
        if (!state.keys['leftHeld']) {
          movePlayer(-1);
          state.keys['leftHeld'] = true;
        }
      } else {
        state.keys['leftHeld'] = false;
      }

      if (state.keys.ArrowRight || state.controls.right) {
        if (!state.keys['rightHeld']) {
          movePlayer(1);
          state.keys['rightHeld'] = true;
        }
      } else {
        state.keys['rightHeld'] = false;
      }

      if (state.controls.boost || state.keys.ArrowUp) {
        state.player.speed = clamp(state.player.speed + 0.22, 0, state.player.maxSpeed);
      } else {
        state.player.speed *= 0.98;
        if (state.player.speed < 0.2) state.player.speed = 0;
      }

      if (state.controls.brake || state.keys.ArrowDown) {
        state.player.speed = clamp(state.player.speed - 0.3, 0, state.player.maxSpeed);
      }

      state.player.x = laneX(state.player.lane);
      state.player.score += state.player.speed * 0.85;
      state.roadScroll += state.player.speed * 2.4;
      updateHUD();
    }

    function updateRacers() {
      const playerSpeed = state.player.speed;

      for (const bot of state.racers) {
        bot.y += (playerSpeed + 4 - bot.speed) * 1.4;

        if (bot.y > canvas.height + 100) {
          bot.lane = Math.floor(Math.random() * 3);
          bot.x = laneX(bot.lane);
          bot.y = -120 - Math.random() * 200;
          bot.speed = 200 / 18;
        }

        bot.x = laneX(bot.lane);

        const overlapY = Math.abs(bot.y - state.player.y) < 60;
        const sameLane = bot.lane === state.player.lane;

        if (sameLane && overlapY) {
          state.gameOver = true;
          messageEl.classList.add('visible');
        }
      }
    }

    function updateHUD() {
      const displaySpeed = Math.round(state.player.speed * 18);
      speedValue.textContent = displaySpeed + ' km/h';
      scoreValue.textContent = Math.floor(state.player.score).toString();

      const standings = [
        { name: PLAYER_NAME, score: Math.floor(state.player.score) },
        ...state.racers.map(bot => ({ name: bot.name, score: Math.floor(bot.y * 0.8 + Math.random() * 30) }))
      ].sort((a, b) => b.score - a.score)
       .slice(0, 8);

      leaderboardEl.innerHTML = '<div class="leader-title">Leaderboard</div>' + standings.map((entry, index) => `
        <div class="leader-item">
          <span class="name">${index + 1}. ${entry.name}</span>
          <span class="score">${entry.score}</span>
        </div>
      `).join('');
    }

    function drawRoad() {
      const width = canvas.width;
      const height = canvas.height;
      const roadLeft = width * 0.25;
      const roadRight = width * 0.75;
      const roadWidth = roadRight - roadLeft;
      const laneWidth = roadWidth / 3;

      ctx.fillStyle = '#0c3c2d';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#303a42';
      ctx.fillRect(roadLeft, 0, roadWidth, height);

      ctx.fillStyle = '#1c2328';
      const centerGapWidth = 14;
      ctx.fillRect(width / 2 - centerGapWidth / 2, 0, centerGapWidth, height);

      ctx.fillStyle = '#d5d9dc';
      for (let i = -1; i < 16; i++) {
        const y = ((i * 80) + (state.roadScroll % 80)) - 80;
        const lane1X = roadLeft + laneWidth - 4;
        const lane2X = roadLeft + laneWidth * 2 - 4;
        ctx.fillRect(lane1X, y, 8, 44);
        ctx.fillRect(lane2X, y, 8, 44);
      }

      ctx.strokeStyle = '#e2e7eb';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(roadLeft + 2, 0);
      ctx.lineTo(roadLeft + 2, height);
      ctx.moveTo(roadRight - 2, 0);
      ctx.lineTo(roadRight - 2, height);
      ctx.stroke();
    }

    function drawCar(x, y, color, name, isPlayer) {
      const width = isPlayer ? 46 : 42;
      const height = isPlayer ? 84 : 78;
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = color;
      ctx.fillRect(-width / 2, -height / 2, width, height);

      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(-width / 2 + 8, -height / 2 + 10, width - 16, height * 0.42);

      ctx.fillStyle = '#0b0d10';
      ctx.fillRect(-width / 2 + 6, -height / 2 + 8, 8, 14);
      ctx.fillRect(width / 2 - 14, -height / 2 + 8, 8, 14);
      ctx.fillRect(-width / 2 + 6, height / 2 - 22, 8, 14);
      ctx.fillRect(width / 2 - 14, height / 2 - 22, 8, 14);

      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(-width / 2 + 8, -height / 2 + 5, width - 16, 12);

      ctx.fillStyle = '#0b0d10';
      ctx.fillRect(-width / 2 + 10, height / 2 - 22, width - 20, 10);

      ctx.restore();

      ctx.fillStyle = '#edf6ff';
      ctx.font = `${isPlayer ? 'bold 14px' : '12px'} Arial`;
      ctx.textAlign = 'center';
      ctx.fillText(name, x, y + height / 2 + 18);
    }

    function drawBackground() {
      drawRoad();

      for (const bot of state.racers) {
        drawCar(bot.x, bot.y, bot.color, bot.name, false);
      }

      drawCar(state.player.x, state.player.y, '#49f3b4', PLAYER_NAME, true);
    }

    function animate() {
      requestAnimationFrame(animate);

      updatePlayer();
      updateRacers();
      drawBackground();
    }

    function handleKeydown(event) {
      const key = event.key;
      state.keys[key] = true;

      if (event.repeat && key !== 'r' && key !== 'R') {
        return;
      }

      if (key === 'ArrowLeft') {
        event.preventDefault();
        movePlayer(-1);
      }

      if (key === 'ArrowRight') {
        event.preventDefault();
        movePlayer(1);
      }

      if (key.toLowerCase() === 'r') {
        resetGame();
      }
    }

    function handleKeyup(event) {
      state.keys[event.key] = false;
    }

    function handleTouchAction(action, isDown) {
      state.controls[action] = isDown;

      if (action === 'left' && isDown) {
        movePlayer(-1);
      }

      if (action === 'right' && isDown) {
        movePlayer(1);
      }

      if (!isDown) {
        state.controls.left = false;
        state.controls.right = false;
      }

      if (action === 'boost' && !isDown) state.controls.boost = false;
      if (action === 'brake' && !isDown) state.controls.brake = false;
    }

    document.addEventListener('keydown', handleKeydown);
    document.addEventListener('keyup', handleKeyup);
    restartBtn.addEventListener('click', resetGame);

    for (const button of document.querySelectorAll('.touch-btn')) {
      const action = button.dataset.action;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        handleTouchAction(action, true);
      });
      button.addEventListener('pointerup', () => handleTouchAction(action, false));
      button.addEventListener('pointerleave', () => handleTouchAction(action, false));
      button.addEventListener('pointercancel', () => handleTouchAction(action, false));
    }

    window.addEventListener('resize', resizeCanvas);

    resizeCanvas();
    resetGame();
    animate();
  </script>
</body>
</html>
